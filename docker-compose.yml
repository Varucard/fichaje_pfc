# Entorno de desarrollo: app en http://localhost:8080, phpMyAdmin en http://localhost:8081,
# buzón de prueba (Mailpit) en http://localhost:8025
services:
  php:
    build:
      context: .
      args:
        XDEBUG: ${XDEBUG:-0}
    container_name: pfc_php
    ports:
      - "8080:80" # El lector Arduino se conecta a este puerto
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 start_with_request=yes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: pfc_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
      MYSQL_USER: ${MYSQL_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecutan la primera vez (base vacía)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Tareas programadas cada 15 minutos (bin/tareas.php): emails, backup diario y control del lector.
  tareas:
    build: .
    container_name: pfc_tareas
    command: ["sh", "-c", "while true; do php bin/tareas.php; sleep 900; done"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Buzón de prueba para desarrollo: atrapa todos los emails sin enviarlos.
  # Usar en el .env: MAIL_HOST=mailpit, MAIL_PUERTO=1025, MAIL_SEGURIDAD=ninguna, MAIL_USUARIO= (vacío)
  mailpit:
    image: axllent/mailpit:latest
    container_name: pfc_mailpit
    ports:
      - "8025:8025"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pfc_phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  vendor:
